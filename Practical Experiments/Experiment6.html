<!DOCTYPE html>
<html>

<body>
<h1>Experiment 6</h1>
<h2>To write JavaScript program that perform basic arithmetic operations and implementaions making statements such as if-else and switch-case</h2>
<script>
    // Factorial Function
    function factorial(n) {
        let fact = 1;
        for (let i = 1; i <= n; i++) {
            fact *= i;
        }
        return fact;
    }
    document.write("<h3>Factorial</h3>");
    document.write("Factorial of 5 = <b>" + factorial(5) + "</b><br><br>");
    // Fibonacci Function
    function fibonacci(n) {
        let a = 0, b = 1;
        document.write("<h3>Fibonacci Series (10 Terms)</h3>");
        for (let i = 1; i <= n; i++) {
            document.write(a + " ");
            let next = a + b;
            a = b;
            b = next;
        }
        document.write("<br><br>");
    }
    fibonacci(10);
    // Multiplication Table Function
    function table(num) {
        document.write("<h3>Multiplication Table of 7</h3>");
        for (let i = 1; i <= 10; i++) {
            document.write(num + " x " + i + " = " + (num * i) + "<br>");
        }
    }
    table(7);
</script>
</body>
</html>
