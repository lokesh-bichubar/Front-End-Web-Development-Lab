<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment 4</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}
.site-header{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
}
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}
.card{
    flex:1 1 300px;
    background:#ffffff;
    border:2px solid #003366;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.card h2{
    color:#003366;
    margin-bottom:10px;
}
.site-footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

@media(max-width:768px){
    .card{
        flex:1 1 100%;
    }
}

@media(max-width:480px){
    .h1{
        font-size:22px;
    }
}
</style>
</head>
<body>
<header class="site-header">
    Create a responsive Webpage using CSS selector Box Model, Flexbox and Media Queries.
</header>
<div class="container">
    <div class="card">
        <h2>HTML</h2>
        <p>
            Creates Webpage Structures.
        </p>
    </div>
    <div class="card">
        <h2>CSS</h2>
        <p>
        Styles the webpage
        </p>
    </div>
    <div class="card">
        <h2>Flexbox</h2>
        <p>
        Arrange webpage elements.
        </p>
    </div>
</div>
<footer class="site-footer">
    © 2026 Lokesh Bichubar, Faridabad. All Rights Reserved.
</footer>
</body>
</html>
